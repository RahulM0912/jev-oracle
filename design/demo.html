<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev Oracle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f3ea;
    --surface: #fffdf8;
    --surface-2: #f0eadc;
    --text: #1f1b2e;
    --muted: #6b6480;
    --border: #e2d9c5;
    --accent: #5b3fd6;
    --accent-soft: #ece7ff;
    --gold: #b7791f;
    --good: #1f8a5b;
    --bad: #c2413b;
    --shadow: 0 1px 2px rgba(31,27,46,.06), 0 8px 24px rgba(31,27,46,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13111c; --surface: #1c1928; --surface-2: #262236; --text: #efeaff;
      --muted: #a39cba; --border: #2f2a42; --accent: #9d86ff; --accent-soft: #2a2447;
      --gold: #e3b04b; --good: #4cc38a; --bad: #f07167; --shadow: 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #13111c; --surface: #1c1928; --surface-2: #262236; --text: #efeaff;
    --muted: #a39cba; --border: #2f2a42; --accent: #9d86ff; --accent-soft: #2a2447;
    --gold: #e3b04b; --good: #4cc38a; --bad: #f07167; --shadow: 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 "DM Sans", system-ui, sans-serif; }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; line-height: 1.15; margin: 0; }
  a { color: inherit; }
  button, input, textarea { font: inherit; color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; }

  header.top { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: "Fraunces", serif; font-weight: 700; font-size: 1.25rem; }
  .brand-mark { width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, transparent 40%), linear-gradient(135deg, var(--accent), var(--gold)); }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .875rem; }
  .demo-banner { background: var(--accent-soft); border: 1px dashed var(--accent); color: var(--text); border-radius: 12px; padding: 10px 14px; font-size: .875rem; margin-bottom: 24px; }

  .hero { padding: 24px 0 32px; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3rem); }
  .hero p { color: var(--muted); max-width: 560px; margin: 12px 0 0; font-size: 1.05rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { position: relative; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s ease, border-color .15s ease; }
  .card:hover:not([disabled]), .card:focus-visible:not([disabled]) { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .card[disabled] { cursor: not-allowed; opacity: .6; }
  .card .emoji { font-size: 1.75rem; }
  .card h3 { font-size: 1.25rem; margin: 10px 0 6px; }
  .card p { margin: 0; color: var(--muted); font-size: .95rem; }
  .tag { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-top: 14px; }
  .tag.type { background: var(--accent-soft); color: var(--accent); }

  .back { display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 8px 0; margin-bottom: 8px; }
  .back:hover { color: var(--text); }
  .mode-head { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
  .mode-head .emoji { font-size: 2.25rem; }
  .mode-head h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); }
  .lead { color: var(--muted); margin: 0 0 24px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  label.field { display: block; font-weight: 700; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: .875rem; margin: 0 0 10px; }
  textarea, input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .counter { text-align: right; font-size: .75rem; color: var(--muted); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .chip { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .error { color: var(--bad); font-size: .9rem; margin-top: 10px; }

  .cat { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .cat:first-of-type { border-top: 0; padding-top: 0; }
  .cat-head { display: flex; justify-content: space-between; align-items: baseline; }
  .opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: .85rem; }
  .opt button { border: 0; background: var(--surface-2); border-radius: 50%; width: 20px; height: 20px; line-height: 18px; cursor: pointer; padding: 0; }
  .add-opt { display: inline-flex; gap: 6px; }
  .add-opt input { width: 130px; padding: 4px 10px; border-radius: 999px; font-size: .85rem; }

  .result { margin-top: 20px; }
  .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); padding: 24px; }
  .orb-spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .verdict { text-align: center; padding: 28px 16px; }
  .orb { width: 140px; height: 140px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, #ffffff55, transparent 45%), linear-gradient(135deg, var(--accent), #2a1b6e); box-shadow: 0 0 40px var(--accent-soft); color: #fff; font-family: "Fraunces", serif; font-size: 1.9rem; animation: pop .45s ease; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .verdict h3 { font-size: 1.6rem; }
  .verdict .sub { color: var(--muted); margin-top: 6px; }

  .meter { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .meter > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s ease; }
  .meter.good > span { background: var(--good); }
  .meter.bad > span { background: var(--bad); }
  .row { display: grid; grid-template-columns: 28px 1fr 56px; gap: 10px; align-items: center; margin: 10px 0; }
  .row .rank { font-weight: 700; color: var(--muted); }
  .row .rank.first { color: var(--gold); }
  .row .name { font-weight: 500; margin-bottom: 4px; }
  .row .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .winner-line { font-size: .9rem; color: var(--muted); margin: 4px 0 0; }

  .score-big { font-family: "Fraunces", serif; font-size: 3.5rem; color: var(--accent); line-height: 1; }
  .score-big small { font-size: 1.25rem; color: var(--muted); }

  details.raw { margin-top: 16px; }
  details.raw summary { cursor: pointer; color: var(--muted); font-size: .875rem; }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; overflow-x: auto; font-size: .8rem; }

  .consistency { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--surface-2); font-size: .92rem; }
  .consistency .dots { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .consistency .dot { font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px 8px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: .8rem; }
  .pill.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .pill.warn { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

  /* magic 8-ball */
  .ball-stage { padding: 8px 0 20px; }
  .ball { position: relative; display: grid; place-items: center; width: 220px; height: 220px; margin: 0 auto; border: 0; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 32% 26%, #6b6b6b 0%, #1a1a1a 38%, #000 72%);
    box-shadow: 0 22px 40px rgba(0,0,0,.35), inset -12px -16px 30px rgba(0,0,0,.7), 0 0 0 1px var(--border); }
  .ball::after { content: ""; position: absolute; top: 18px; left: 44px; width: 60px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.18); filter: blur(4px); transform: rotate(-25deg); pointer-events: none; }
  .ball:disabled { cursor: progress; }
  .ball:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .ball-face { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 50%; background: #fff; color: #000; font: 700 58px/1 "DM Sans", sans-serif; }
  .ball-window { display: grid; place-items: center; width: 118px; height: 118px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #16215a, #04061a 75%); box-shadow: inset 0 6px 14px rgba(0,0,0,.9); }
  .tri { display: flex; align-items: flex-start; justify-content: center; width: 100px; height: 88px; padding: 14px 16px 0; margin-top: 8px;
    background: #2b44d9; clip-path: polygon(50% 100%, 0 0, 100% 0); color: #e8ecff; text-align: center;
    font: 700 .62rem/1.2 "DM Sans", sans-serif; text-transform: uppercase; letter-spacing: .03em; animation: rise 1.1s ease-out; }
  .tri span { max-width: 64px; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.85) rotate(-8deg); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }
  .ball.shaking { animation: shake .45s ease-in-out infinite; }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0) rotate(0); }
    20% { transform: translate(-14px, -6px) rotate(-10deg); }
    40% { transform: translate(12px, 4px) rotate(8deg); }
    60% { transform: translate(-10px, 6px) rotate(-6deg); }
    80% { transform: translate(8px, -4px) rotate(5deg); }
  }
  .ball-note { text-align: center; }

  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 48px; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a href="#" class="brand" data-nav="home"><span class="brand-mark" aria-hidden="true"></span>Jev Oracle</a>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐ Theme</button>
  </header>

  <div class="demo-banner">Demo for review. Answers are simulated, shaped like real Jev responses. No API key used.</div>

  <!-- HOME -->
  <main id="home">
    <section class="hero">
      <h1>Ask. Rank. Judge.</h1>
      <p>Pick a mode. Jev doesn't write essays. It makes one clear decision and tells you how sure it is.</p>
    </section>
    <div class="grid" id="cards"></div>
  </main>

  <!-- MODE VIEW -->
  <main id="mode" class="hidden">
    <button class="back" type="button" data-nav="home">← All modes</button>
    <div class="mode-head"><span class="emoji" id="mEmoji"></span><h2 id="mTitle"></h2></div>
    <p class="lead" id="mLead"></p>
    <div id="mBody"></div>
    <div class="result" id="mResult" aria-live="polite"></div>
  </main>

  <footer>Unofficial. Built on TypeSafe's Jev.</footer>
</div>

<script>
/* ---------- modes ---------- */
const MODES = [
  { id: "fortune", emoji: "🔮", title: "Fortune Teller", type: "Yes / No",
    desc: "Ask any yes-or-no question. Get a verdict and how sure Jev is.",
    lead: "Type a yes-or-no question. Jev answers with a probability, and we turn it into a verdict." },
  { id: "ball", emoji: "🎱", title: "Magic 8-Ball", type: "Yes / No",
    desc: "Ask a question, shake the ball, read your fate in the little window.",
    lead: "Ask a yes-or-no question, then shake the ball. It answers with one of the 20 classic 8-Ball replies." },
  { id: "stack", emoji: "🧱", title: "Stack Ranker", type: "Choice",
    desc: "Describe your project. Get tech choices ranked best to worst.",
    lead: "Describe what you're building. Jev ranks the options in each category. Edit the options to compare anything." },
  { id: "roast", emoji: "🔥", title: "Roast My Idea", type: "Score",
    desc: "Pitch an idea. Get rated on originality, feasibility, demand and fun.",
    lead: "Pitch your idea in a few sentences. Jev scores it on four criteria and gives an overall rating." },
  { id: "bouncer", emoji: "🚪", title: "Convince the Bouncer", type: "Yes / No",
    desc: "Talk your way into the most exclusive club in town.",
    lead: "The bouncer is picky. Write your best line. Jev decides if you get in." },
  { id: "akinator", emoji: "🧞", title: "Jev Akinator", type: "Choice + Yes/No", soon: "Phase 3",
    desc: "Think of something. Jev guesses it with yes/no questions." },
  { id: "ttt", emoji: "⭕", title: "Tic-Tac-Toe", type: "Choice", soon: "Phase 3",
    desc: "Play against Jev. It picks every move from the open squares." },
];

const EXAMPLES = {
  fortune: ["Will my side project get 100 users?", "Should I learn Rust this year?", "Is today a good day to deploy on Friday?"],
  ball: ["Will I get the job?", "Should I text them back?", "Will my code compile on the first try?"],
  stack: ["Real-time chat app for 10k users, solo dev who knows JavaScript", "Internal admin dashboard for a small team, needs auth and tables", "Mobile-first recipe sharing app with image uploads"],
  roast: ["Uber for dog walkers, but the dogs rate the walkers", "A browser extension that blurs Twitter until you finish your todo list", "AI that writes your commit messages in Shakespearean English"],
  bouncer: ["I'm on the list. Check under 'Very Important Developer'.", "My friend is the DJ, and I brought snacks for the staff.", "Let me in or I'll explain blockchain to everyone in line."],
};

const STACK_DEFAULTS = {
  Frontend: ["React", "Vue", "Svelte", "Angular"],
  Backend: ["Node.js", "Python (FastAPI)", "Go", "Java (Spring)"],
  Database: ["PostgreSQL", "MongoDB", "SQLite", "Redis"],
  Hosting: ["Vercel", "AWS", "Railway", "Fly.io"],
};

const ROAST_CRITERIA = ["Originality", "Feasibility", "Market demand", "Fun factor"];
const SCORE_LEGEND = { 0: "Weak", 1: "Meh", 2: "Solid", 3: "Great" };
const MAX_LEN = 2000;

/* ---------- mock Jev (same shape as real API) ---------- */
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
const jitter = (n = 0.08) => (Math.random() - 0.5) * 2 * n;
const clamp01 = x => Math.max(0.01, Math.min(0.99, x));
const round2 = x => Math.round(x * 100) / 100;

function mockNoul(key, text) { return { type: "noul", noul: round2(clamp01(hash(key + text) + jitter())) }; }
function mockChoice(key, text, options) {
  const raw = options.map(o => Math.pow(hash(key + text + o) + 0.05 + Math.abs(jitter(0.05)), 3));
  const sum = raw.reduce((a, b) => a + b, 0);
  const probabilities = {}; options.forEach((o, i) => probabilities[o] = round2(raw[i] / sum));
  const choice = options[raw.indexOf(Math.max(...raw))];
  return { type: "choice", choice, confidence: round2(probabilities[choice] * 0.85), probabilities };
}
function mockScore(key, text) {
  const center = hash(key + text) * 3 + jitter(0.25);
  const probs = [0, 1, 2, 3].map(i => Math.exp(-Math.pow(i - center, 2)));
  const sum = probs.reduce((a, b) => a + b, 0);
  const probabilities = {}; probs.forEach((p, i) => probabilities[i] = round2(p / sum));
  const score = round2([0, 1, 2, 3].reduce((a, i) => a + i * probs[i] / sum, 0));
  return { type: "score", score, confidence: round2(Math.max(...probs) / sum), legend: SCORE_LEGEND, probabilities };
}
function mockJev(questions, state) {
  const answers = {}; let tokens = 60 + state.length / 4;
  for (const [k, q] of Object.entries(questions)) {
    tokens += 30 + q.instructions.length / 4;
    answers[k] = q.type === "noul" ? mockNoul(k, state) : q.type === "choice" ? mockChoice(k, state, Object.keys(q.criteria)) : mockScore(k, state);
  }
  return new Promise(res => setTimeout(() => res({ model: "jev-1.13.0 (mock)", answers, usage: { input_tokens: Math.round(tokens), output_tokens: 40 } }), 700 + Math.random() * 500));
}

/* ---------- request builders (these move to lib/modes/*.ts in the real app) ---------- */
const BUILD = {
  fortune: ({ text }) => ({ state: `Question asked to a fortune teller: "${text}"`,
    questions: { answer: { type: "noul", instructions: `Considering general knowledge and common sense, is the answer to this question more likely yes than no? Question: ${text}` } } }),
  ball: ({ text }) => ({ state: `Question asked to a Magic 8-Ball: "${text}"`,
    questions: { answer: { type: "noul", instructions: `Considering general knowledge and common sense, is the answer to this question more likely yes than no? Question: ${text}` } } }),
  stack: ({ text, cats }) => ({ state: `Project description: ${text}`,
    questions: Object.fromEntries(Object.entries(cats).map(([cat, opts]) => [cat,
      { type: "choice", instructions: `Which ${cat.toLowerCase()} option is the best fit for this project?`, criteria: Object.fromEntries(opts.map(o => [o, o])) }])) }),
  roast: ({ text }) => ({ state: `Startup / project idea: ${text}`,
    questions: Object.fromEntries(ROAST_CRITERIA.map(c => [c, { type: "score", instructions: `Rate this idea's ${c.toLowerCase()}.`, criteria: Object.values(SCORE_LEGEND) }])) }),
  bouncer: ({ text }) => ({ state: `A person at the door of an exclusive nightclub says to the bouncer: "${text}"`,
    questions: { let_in: { type: "noul", instructions: "Would a strict but fair bouncer be convinced to let this person in based on what they said?" } } }),
};

/* ---------- presenters ---------- */
function fortuneVerdict(p) {
  if (p >= 0.85) return ["Yes, definitely.", "The signs are clear."];
  if (p >= 0.65) return ["Most likely yes.", "The odds lean your way."];
  if (p >= 0.45) return ["Hard to say.", "The future is cloudy. Ask again later."];
  if (p >= 0.2) return ["Probably not.", "Don't count on it."];
  return ["No.", "My sources say no."];
}
const pct = x => Math.round(x * 100) + "%";

/* classic 20 answers, bucketed by Jev's chance-of-yes */
const BALL_ANSWERS = [
  [0.8, ["It is certain.", "It is decidedly so.", "Without a doubt.", "Yes, definitely.", "You may rely on it."]],
  [0.6, ["As I see it, yes.", "Most likely.", "Outlook good.", "Yes.", "Signs point to yes."]],
  [0.4, ["Reply hazy, try again.", "Ask again later.", "Better not tell you now.", "Cannot predict now.", "Concentrate and ask again."]],
  [0, ["Don't count on it.", "My reply is no.", "My sources say no.", "Outlook not so good.", "Very doubtful."]],
];
function ballAnswer(p, question) {
  const list = BALL_ANSWERS.find(([min]) => p >= min)[1];
  return list[Math.floor(hash(question.trim().toLowerCase()) * list.length)];
}

function renderResult(id, input, res) {
  const a = res.answers;
  if (id === "fortune") {
    const p = a.answer.noul, [title, sub] = fortuneVerdict(p);
    return `<div class="panel verdict"><div class="orb">${pct(p)}</div><h3>${title}</h3><p class="sub">${sub}</p>
      <p class="sub">Chance of "yes": <b>${pct(p)}</b></p></div>`;
  }
  if (id === "ball") {
    const p = a.answer.noul;
    return `<div class="panel ball-note">The ball says <b>“${esc(ballAnswer(p, input.text))}”</b><br>
      <span class="hint">Behind the glass, Jev put the chance of “yes” at <b>${pct(p)}</b>.</span></div>`;
  }
  if (id === "bouncer") {
    const p = a.let_in.noul, inn = p >= 0.5;
    return `<div class="panel verdict"><div class="orb">${inn ? "✓" : "✕"}</div><h3>${inn ? "You're in. Enjoy the night." : "Not tonight, friend."}</h3>
      <p class="sub">Bouncer convinced: <b>${pct(p)}</b></p><div class="meter ${inn ? "good" : "bad"}" style="max-width:320px;margin:12px auto 0"><span style="width:${pct(p)}"></span></div></div>`;
  }
  if (id === "stack") {
    const blocks = Object.entries(a).map(([cat, ans]) => {
      const ranked = Object.entries(ans.probabilities).sort((x, y) => y[1] - x[1]);
      return `<div class="cat"><div class="cat-head"><h3 style="font-size:1.1rem">${esc(cat)}</h3><span class="tag type">confidence ${pct(ans.confidence)}</span></div>
        ${ranked.map(([o, p], i) => `<div class="row"><span class="rank ${i === 0 ? "first" : ""}">#${i + 1}</span>
          <div><div class="name">${esc(o)}${i === 0 ? " ⭐" : ""}</div><div class="meter"><span style="width:${pct(p)}"></span></div></div><span class="pct">${pct(p)}</span></div>`).join("")}</div>`;
    }).join("");
    const pick = Object.entries(a).map(([cat, ans]) => `<b>${esc(ans.choice)}</b>`).join(" + ");
    return `<div class="panel"><h3>Recommended stack</h3><p class="winner-line">${pick}</p>${blocks}</div>`;
  }
  if (id === "roast") {
    const rows = ROAST_CRITERIA.map(c => ({ c, s: a[c].score, conf: a[c].confidence }));
    const overall = Math.round(rows.reduce((t, r) => t + r.s, 0) / (3 * rows.length) * 100) / 10;
    const line = overall >= 8 ? "Honestly? Ship it." : overall >= 6 ? "Promising. Needs a sharper edge." : overall >= 4 ? "There's something here… somewhere." : "Back to the whiteboard.";
    return `<div class="panel"><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="score-big">${overall.toFixed(1)}<small>/10</small></div>
      <div><h3>${line}</h3><p class="winner-line">Average of 4 criteria, each scored 0–3.</p></div></div>
      ${rows.map(r => `<div class="row" style="grid-template-columns:1fr 90px"><div><div class="name">${r.c}</div>
        <div class="meter"><span style="width:${Math.round(r.s / 3 * 100)}%"></span></div></div>
        <span class="pct">${SCORE_LEGEND[Math.round(r.s)]} · ${r.s.toFixed(1)}</span></div>`).join("")}</div>`;
  }
}

/* headline number per mode, used by consistency check */
const HEADLINE = {
  fortune: r => r.answers.answer.noul,
  ball: r => r.answers.answer.noul,
  bouncer: r => r.answers.let_in.noul,
  stack: r => Object.values(r.answers)[0].probabilities[Object.values(r.answers)[0].choice],
  roast: r => ROAST_CRITERIA.reduce((t, c) => t + r.answers[c].score, 0) / (3 * ROAST_CRITERIA.length),
};
const HEADLINE_LABEL = { fortune: "Chance of yes", ball: "Chance of yes", bouncer: "Convinced", stack: "Top pick share (first category)", roast: "Overall rating" };

/* ---------- views ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let current = null, stackCats = null, lastInput = null;

function renderCards() {
  $("#cards").innerHTML = MODES.map(m => `<button class="card" type="button" data-mode="${m.id}" ${m.soon ? "disabled" : ""}>
    <span class="emoji" aria-hidden="true">${m.emoji}</span><h3>${m.title}</h3><p>${m.desc}</p>
    <span class="tag type">${m.type}</span> ${m.soon ? `<span class="tag">Coming in ${m.soon}</span>` : ""}</button>`).join("");
}

function showHome() { $("#home").classList.remove("hidden"); $("#mode").classList.add("hidden"); current = null; history.replaceState(null, "", "#"); window.scrollTo(0, 0); }

function showMode(id) {
  const m = MODES.find(x => x.id === id); if (!m || m.soon) return showHome();
  current = id; lastInput = null;
  $("#home").classList.add("hidden"); $("#mode").classList.remove("hidden");
  $("#mEmoji").textContent = m.emoji; $("#mTitle").textContent = m.title; $("#mLead").textContent = m.lead;
  $("#mResult").innerHTML = "";
  const placeholder = { fortune: "Will it rain on my wedding day?", ball: "Ask a yes-or-no question…", stack: "What are you building? Who uses it? Any constraints?", roast: "Describe your idea in 1–3 sentences…", bouncer: "Say something to the bouncer…" }[id];
  const label = { fortune: "Your question", ball: "Your question", stack: "Your project", roast: "Your idea", bouncer: "Your line" }[id];
  $("#mBody").innerHTML = `<form class="panel" id="form" novalidate>
      ${id === "ball" ? `<div class="ball-stage"><button type="submit" class="ball" id="ball" aria-label="Shake the ball">
        <span class="ball-face" id="ballFace">8</span>
        <span class="ball-window hidden" id="ballWindow"><span class="tri" id="tri"><span id="ballText"></span></span></span>
      </button><p class="hint" style="text-align:center;margin:10px 0 0">Tap the ball to shake it</p></div>` : ""}
      <label class="field" for="text">${label}</label>
      <textarea id="text" rows="${id === "fortune" || id === "ball" ? 2 : 3}" maxlength="${MAX_LEN}" placeholder="${placeholder}"></textarea>
      <div class="counter"><span id="count">0</span>/${MAX_LEN}</div>
      <p class="hint" style="margin:6px 0 0">Try an example:</p>
      <div class="chips">${EXAMPLES[id].map(e => `<button type="button" class="chip" data-example="${esc(e)}">${esc(e)}</button>`).join("")}</div>
      ${id === "stack" ? `<div style="margin-top:20px"><label class="field">Options to rank</label><p class="hint">Remove what you don't want, add what you do. 2–6 per category.</p><div id="cats"></div></div>` : ""}
      <div class="actions"><button class="btn" id="go" type="submit">${{ fortune: "Ask the oracle", ball: "🎱 Shake the ball", stack: "Rank my stack", roast: "Roast it", bouncer: "Try to get in" }[id]}</button>
      <button class="btn ghost hidden" id="again" type="button">Check consistency (ask 5×)</button></div>
      <div class="error hidden" id="err"></div></form>`;
  if (id === "stack") { stackCats = JSON.parse(JSON.stringify(STACK_DEFAULTS)); renderCats(); }
  history.replaceState(null, "", "#" + id); window.scrollTo(0, 0); $("#text").focus();
}

function renderCats() {
  $("#cats").innerHTML = Object.entries(stackCats).map(([cat, opts]) => `<div class="cat"><div class="cat-head"><b>${cat}</b><span class="hint" style="margin:0">${opts.length} options</span></div>
    <div class="chips">${opts.map((o, i) => `<span class="opt">${esc(o)}<button type="button" aria-label="Remove ${esc(o)}" data-rm="${cat}|${i}">×</button></span>`).join("")}
    ${opts.length < 6 ? `<span class="add-opt"><input type="text" placeholder="+ add option" data-add="${cat}" aria-label="Add ${cat} option" /></span>` : ""}</div></div>`).join("");
}

function validate(text) {
  if (!text.trim()) return "Type something first.";
  if (text.length > MAX_LEN) return `Keep it under ${MAX_LEN} characters.`;
  if (current === "stack" && Object.values(stackCats).some(o => o.length < 2)) return "Each category needs at least 2 options.";
  return null;
}

async function run() {
  const text = $("#text").value, err = validate(text);
  $("#err").classList.toggle("hidden", !err); $("#err").textContent = err || "";
  if (err) return;
  lastInput = { text, cats: stackCats };
  const req = BUILD[current](lastInput);
  $("#go").disabled = true; $("#again").classList.add("hidden");
  const isBall = current === "ball";
  if (isBall) {
    $("#ball").disabled = true; $("#ball").classList.add("shaking");
    $("#ballWindow").classList.add("hidden"); $("#ballFace").classList.remove("hidden");
    $("#mResult").innerHTML = "";
  } else {
    $("#mResult").innerHTML = `<div class="panel loading"><span class="orb-spin"></span>Consulting the oracle…</div>`;
  }
  try {
    const minShake = isBall ? new Promise(r => setTimeout(r, 1300)) : null;
    const res = await mockJev(req.questions, req.state);
    if (isBall) {
      await minShake;
      $("#ball").classList.remove("shaking");
      $("#ballFace").classList.add("hidden");
      $("#ballText").textContent = ballAnswer(res.answers.answer.noul, text);
      $("#ballWindow").classList.remove("hidden");
    }
    $("#mResult").innerHTML = renderResult(current, lastInput, res) +
      `<details class="raw"><summary>Show what was sent to Jev and what came back</summary><pre>${esc(JSON.stringify({ request: { model: "jev-latest", ...req }, response: res }, null, 2))}</pre></details>`;
    $("#again").classList.remove("hidden");
  } catch (e) {
    $("#mResult").innerHTML = `<div class="panel error">The oracle is sleeping. Try again in a moment.</div>`;
  } finally {
    $("#go").disabled = false;
    if (isBall) { $("#ball").disabled = false; $("#ball").classList.remove("shaking"); }
  }
}

async function consistency() {
  if (!lastInput) return;
  const req = BUILD[current](lastInput), btn = $("#again");
  btn.disabled = true; btn.textContent = "Asking 5 times…";
  const results = await Promise.all(Array.from({ length: 5 }, () => mockJev(req.questions, req.state)));
  const vals = results.map(HEADLINE[current]), min = Math.min(...vals), max = Math.max(...vals), spread = max - min;
  const stable = spread <= 0.15;
  const box = document.createElement("div"); box.className = "consistency";
  box.innerHTML = `<b>Consistency check</b> · ${HEADLINE_LABEL[current]} across 5 identical requests
    <div class="dots">${vals.map(v => `<span class="dot">${pct(v)}</span>`).join("")}</div>
    Spread: <b>${pct(spread)}</b> <span class="pill ${stable ? "ok" : "warn"}">${stable ? "Stable" : "Wobbly"}</span>
    <p class="hint" style="margin:6px 0 0">${stable ? "Same question, near-same answer. Safe to rely on for this kind of decision." : "Answers vary a lot. Treat this decision as a suggestion, not a rule."}</p>`;
  $("#mResult").querySelector(".consistency")?.remove();
  $("#mResult").appendChild(box);
  btn.disabled = false; btn.textContent = "Check consistency (ask 5×)";
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-nav],[data-mode],[data-example],[data-rm],#again");
  if (!t) return;
  if (t.dataset.nav === "home") { e.preventDefault(); showHome(); }
  else if (t.dataset.mode) showMode(t.dataset.mode);
  else if (t.dataset.example) { $("#text").value = t.dataset.example; $("#count").textContent = t.dataset.example.length; $("#text").focus(); }
  else if (t.dataset.rm) { const [c, i] = t.dataset.rm.split("|"); stackCats[c].splice(+i, 1); renderCats(); }
  else if (t.id === "again") consistency();
});
document.addEventListener("submit", e => { e.preventDefault(); run(); });
document.addEventListener("input", e => { if (e.target.id === "text") $("#count").textContent = e.target.value.length; });
document.addEventListener("keydown", e => {
  if (e.target.id === "text" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  const add = e.target.dataset?.add;
  if (add && e.key === "Enter") { e.preventDefault(); const v = e.target.value.trim();
    if (v && !stackCats[add].includes(v) && stackCats[add].length < 6) { stackCats[add].push(v); renderCats(); document.querySelector(`[data-add="${add}"]`)?.focus(); } }
});

$("#themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("jev-theme", root.dataset.theme); } catch {}
});
try { const t = localStorage.getItem("jev-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

renderCards();
const start = location.hash.slice(1); if (start) showMode(start);
</script>
</body>
</html>
